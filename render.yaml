services:
  - type: web
    name: forgefit-api
    runtime: node
    rootDir: fitness-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://forgefit-web.onrender.com

  - type: web
    name: forgefit-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://forgefit-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html